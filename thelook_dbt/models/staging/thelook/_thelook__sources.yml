version: 2

sources:
  - name: thelook
    description: "Synthetic e-commerce data from the public BigQuery dataset, updated daily"
    database: bigquery-public-data
    schema: thelook_ecommerce
    tables:
      - name: orders
      - name: order_items
      - name: users
      - name: products
      - name: inventory_items
      - name: distribution_centers
      - name: events