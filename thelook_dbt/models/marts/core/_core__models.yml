models:
  - name: fct_order_items
    description: "One row per order item. Core sales fact table with revenue, cost and margin."
    columns:
      - name: order_item_id
        description: "Primary key; grain of the table"
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: "Degenerate dimension: the order this item belongs to"

      - name: user_id
        description: "Customer who placed the order"

      - name: product_id
        description: "Product sold"

      - name: order_item_status
        description: "Current status of the order item"

      - name: is_returned
        description: "True if the item was returned"

      - name: is_revenue
        description: "True if the item counts toward revenue: status is not cancelled or returned"

      - name: sale_price
        description: "Price the item was sold for"

      - name: cost
        description: "Cost of the specific inventory item"

      - name: gross_margin
        description: "sale_price minus cost, regardless of item status"
      
      - name: created_date
        description: "Date when the item was added to the order (UTC); join key to dim_date"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: created_at
        description: "Timestamp when the item was added to the order"

      - name: shipped_at
        description: "Timestamp when the item was shipped; null if not shipped yet"

      - name: delivered_at
        description: "Timestamp when the item was delivered; null if not delivered yet"

      - name: returned_at
        description: "Timestamp when the item was returned; null if not returned"

  - name: dim_products
    description: "One row per product, enriched with distribution center name."
    columns:
      - name: product_id
        description: "Primary key of the product"
        data_tests:
          - unique
          - not_null

      - name: distribution_center_id
        description: "Distribution center the product ships from"

      - name: product_name
        description: "Product name"

      - name: category
        description: "Product category"

      - name: brand
        description: "Product brand"

      - name: department
        description: "Product department"

      - name: sku
        description: "Product SKU"

      - name: cost
        description: "Product cost"

      - name: retail_price
        description: "Product retail price"

      - name: distribution_center_name
        description: "Distribution center name (joined from distribution centers)"
        data_tests:
          - not_null
  
  - name: dim_users
    description: "One row per user, including users without orders. Profile attributes plus lifetime order metrics."
    columns:
      - name: user_id
        description: "Primary key of the user"
        data_tests:
          - unique
          - not_null

      - name: age
        description: "User age"

      - name: age_group
        description: "Age bucket: under 25, 25-34, 35-44, 45-54, 55+"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['under 25', '25-34', '35-44', '45-54', '55+']

      - name: gender
        description: "User gender"

      - name: city
        description: "User city"

      - name: state
        description: "User state or region"

      - name: country
        description: "User country"

      - name: traffic_source
        description: "Acquisition channel"

      - name: orders_count
        description: "Number of distinct orders placed, including cancelled and returned; 0 if none"
        data_tests:
          - not_null

      - name: lifetime_revenue
        description: "Sum of sale_price for items that count toward revenue (not cancelled or returned); 0 if none"
        data_tests:
          - not_null

      - name: created_at
        description: "User registration timestamp"

      - name: first_order_at
        description: "Timestamp of the first order (any status); null if the user has no orders"

      - name: last_order_at
        description: "Timestamp of the most recent order (any status); null if the user has no orders"

  - name: dim_date
    description: "One row per calendar day from 2019-01-01 to one year ahead. Generated with dbt_utils.date_spine."
    columns:
      - name: date_day
        description: "Calendar date; primary key"
        data_tests:
          - unique
          - not_null

      - name: year
        description: "Calendar year"

      - name: quarter
        description: "Calendar quarter (1-4)"

      - name: month
        description: "Month number (1-12)"

      - name: month_name
        description: "Full month name, e.g. January"

      - name: iso_week
        description: "ISO week number"

      - name: day_of_week
        description: "Day of week in BigQuery convention: 1 = Sunday, 7 = Saturday"

      - name: day_name
        description: "Full day name, e.g. Monday"

      - name: is_weekend
        description: "True for Saturday and Sunday"

      - name: month_start_date
        description: "First day of the month"

      - name: week_start_date
        description: "First day of the ISO week (Monday)"